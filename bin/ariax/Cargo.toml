[package]
name = "ariax-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ariax"
path = "src/main.rs"

[features]
default = []
minimal = ["ariax-engine/metalink"]
standard = ["minimal", "ariax-engine/ftp", "ariax-engine/sftp"]
full = ["standard"]
compat = ["full"]

[dependencies]
ariax-config.workspace = true
ariax-core.workspace = true
ariax-engine.workspace = true
ariax-runtime.workspace = true
ariax-storage.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "net", "rt-multi-thread", "signal"] }

[target.'cfg(windows)'.dev-dependencies]
ariax-windows-security.workspace = true

[lints]
workspace = true
