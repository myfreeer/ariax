name: Native Linux RPC Benchmarks

on:
  workflow_call:
    inputs:
      phase5:
        description: Admit active ranges through Metalink
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      phase5:
        description: Admit active ranges through Metalink
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: native-linux-rpc-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  active-ranges:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      ARIAX_BENCH_METALINK: ${{ inputs.phase5 && '1' || '0' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            toolchains/ci-target/benchmarks
          key: ci-benchmarks-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'scripts/ci.py') }}
      - name: Build and measure sequential bounded scenarios
        shell: bash
        run: |
          set -euo pipefail
          ulimit -n 20000
          python3 scripts/ci.py benchmark
      - name: Preserve reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-linux-rpc-benchmarks
          path: toolchains/ci-reports/benchmarks/
          if-no-files-found: warn
