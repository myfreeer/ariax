name: Native Linux RPC Benchmarks

on:
  workflow_dispatch:
    inputs:
      phase5:
        description: Admit active ranges through Metalink
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: native-linux-rpc-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  active-ranges:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8:backslashreplace"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      ARIAX_BT_NATIVE_VERIFIED: "0"
      ARIAX_BENCH_METALINK: ${{ inputs.phase5 && '1' || '0' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: toolchains/bt-native/*/install
          key: bt-native-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/libtorrent/sources.json', 'native/libtorrent/ariax.patch', 'native/libtorrent/openssl.patch', 'scripts/bt_native.py') }}
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            toolchains/ci-target/benchmarks
          key: ci-benchmarks-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: ci-benchmarks-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-
      - name: Build and measure sequential bounded scenarios
        shell: bash
        run: |
          set -euo pipefail
          ulimit -n 20000
          python3 scripts/ci.py benchmark
      - name: Save verified native installation
        if: ${{ !cancelled() && env.ARIAX_BT_NATIVE_VERIFIED == '1' && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: toolchains/bt-native/*/install
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Save Cargo outputs
        if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            toolchains/ci-target/benchmarks
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Preserve reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-rpc-benchmarks
          path: toolchains/ci-reports/benchmarks/
          if-no-files-found: warn
