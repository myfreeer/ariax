name: Focused Native Linux Validation

on:
  push:
    branches: [local/removable-storage-mixed-bt-20261003]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focused-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-linux:
    name: Focused Native Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8:backslashreplace"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      RUST_BACKTRACE: "1"
      RUST_TEST_THREADS: "1"
      ARIAX_BT_NATIVE_VERIFIED: "0"
      ARIAX_BENCH_METALINK: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Restore verified native installation
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: toolchains/bt-native/*/install
          key: bt-native-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/libtorrent/sources.json', 'native/libtorrent/ariax.patch', 'native/libtorrent/openssl.patch', 'scripts/bt_native.py') }}
      - name: Restore release benchmark and test outputs
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            toolchains/ci-target/benchmarks
          key: ci-benchmarks-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: ci-benchmarks-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-
      - name: Validate affected tests and measure transfer scenarios
        shell: bash
        run: |
          set -euo pipefail
          ulimit -n 20000
          python3 -B scripts/ci.py focused
      - name: Save verified native installation
        if: ${{ !cancelled() && env.ARIAX_BT_NATIVE_VERIFIED == '1' && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: toolchains/bt-native/*/install
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Save release benchmark and test outputs
        if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            toolchains/ci-target/benchmarks
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Retain focused validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-focused-linux
          path: |
            toolchains/ci-reports/focused/
            toolchains/bt-native/*/logs/
            toolchains/bt-native/*/install/ariax-native.json
          if-no-files-found: warn
