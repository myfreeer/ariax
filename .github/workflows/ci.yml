name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: "2"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            toolchains/ci-target/preflight
          key: ci-preflight-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'scripts/ci.py') }}
      - name: Check workflow, contracts and dependency policies
        run: python3 scripts/ci.py preflight
      - name: Retain preflight diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-preflight
          path: toolchains/ci-reports/preflight/
          if-no-files-found: warn

  validation:
    name: Validate (${{ matrix.check }})
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        include:
          - check: linux
            os: ubuntu-24.04
            toolchain: "1.97.1"
          - check: macos
            os: macos-15
            toolchain: "1.97.1"
          - check: windows-msvc
            os: windows-2022
            toolchain: "1.97.1"
          - check: windows-gnu
            os: windows-2022
            toolchain: "1.97.1-x86_64-pc-windows-gnu"
          - check: msrv-linux
            os: ubuntu-24.04
            toolchain: "1.88.0"
          - check: msrv-windows-gnu
            os: windows-2022
            toolchain: "1.88.0-x86_64-pc-windows-gnu"
          - check: feature-minimal
            os: ubuntu-24.04
            toolchain: "1.97.1"
          - check: feature-standard
            os: ubuntu-24.04
            toolchain: "1.97.1"
          - check: feature-full
            os: ubuntu-24.04
            toolchain: "1.97.1"
          - check: feature-compat
            os: ubuntu-24.04
            toolchain: "1.97.1"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ARIAX_RUST_TOOLCHAIN: ${{ matrix.toolchain }}
      ARIAX_CI_CHECK: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Install MSYS2 MinGW64 dependencies
        if: contains(matrix.check, 'windows-gnu')
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          path-type: minimal
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-pkgconf
      - name: Install and locate pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$ARIAX_RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
          python scripts/ci.py resolve-toolchain >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            toolchains/ci-target/${{ matrix.check }}
            toolchains/ci-target/${{ matrix.check }}-clippy
          key: ci-${{ matrix.check }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'scripts/ci.py') }}
      - name: Validate native platform or feature bundle
        if: ${{ !contains(matrix.check, 'windows-gnu') }}
        shell: bash
        run: python scripts/ci.py validate --check "$ARIAX_CI_CHECK"
      - name: Validate through native MINGW64
        if: contains(matrix.check, 'windows-gnu')
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export MSYSTEM=MINGW64
          export PATH=/mingw64/bin:/usr/local/bin:/usr/bin:/bin
          python scripts/ci.py validate --check "$ARIAX_CI_CHECK"
      - name: Retain validation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ matrix.check }}
          path: toolchains/ci-reports/${{ matrix.check }}/
          if-no-files-found: warn

  native-linux-benchmarks:
    name: Native Linux Acceptance
    needs: [preflight, validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/native-linux-rpc-benchmarks.yml
    with:
      phase5: true

  required:
    name: CI Required
    if: always()
    needs: [preflight, validation, native-linux-benchmarks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Require every applicable stage
        env:
          ARIAX_CI_PREFLIGHT: ${{ needs.preflight.result }}
          ARIAX_CI_VALIDATION: ${{ needs.validation.result }}
          ARIAX_CI_BENCHMARKS: ${{ needs.native-linux-benchmarks.result }}
        run: python3 scripts/ci.py gate

  tag-gate:
    name: Release Tag Gate
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retain the explicit release-platform gate
        run: |
          printf '%s\n' 'Tagging remains disabled until the full target and supply-chain matrix passes.' >&2
          exit 1
