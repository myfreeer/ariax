[alias]
xtask = "run --locked --package ariax-xtask --"

[env]
LIBSQLITE3_FLAGS = { value = "-DSQLITE_MAX_LIKE_PATTERN_LENGTH=65536 -USQLITE_ENABLE_FTS3 -USQLITE_ENABLE_FTS3_PARENTHESIS -USQLITE_ENABLE_FTS5 -USQLITE_ENABLE_RTREE", force = true }
OPENSSL_STATIC = { value = "1", force = true }

# Native C++ dependencies use the active MinGW runtime. Do not mix in
# the standalone Rust distribution's bundled runtime archives.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-self-contained=no", "-C", "link-arg=-static-libgcc", "-C", "link-arg=-static-libstdc++"]
