[workspace]
members = [
    "bin/ariax",
    "crates/ariax-config",
    "crates/ariax-core",
    "crates/ariax-engine",
    "crates/ariax-runtime",
    "crates/ariax-storage",
    "crates/ariax-windows-security",
    "tools/ariax-xtask",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
ariax-config = { path = "crates/ariax-config" }
ariax-core = { path = "crates/ariax-core" }
ariax-engine = { path = "crates/ariax-engine" }
ariax-runtime = { path = "crates/ariax-runtime" }
ariax-storage = { path = "crates/ariax-storage" }
ariax-windows-security = { path = "crates/ariax-windows-security" }
bytes = "=1.12.1"
cookie = { version = "=0.18.1", default-features = false, features = ["percent-encode"] }
cookie_store = { version = "=0.22.1", default-features = false, features = ["public_suffix"] }
crc32c = "=0.6.8"
fs2 = "=0.4.3"
http-body-util = "=0.1.4"
httpdate = "=1.0.3"
hyper = { version = "=1.11.0", features = ["server"] }
hyper-util = "=0.1.20"
hyper-rustls = { version = "=0.27.9", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hickory-resolver = { version = "=0.26.1", default-features = true }
publicsuffix = "=2.3.0"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup", "cache", "limits"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.2"
rustls-pemfile = { version = "=2.2.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = { version = "=0.11.0", default-features = false }
tokio = "=1.53.1"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tower-service = "=0.3.3"
unicode-normalization = "=0.1.25"
url = "=2.5.8"
windows-sys = { version = "=0.61.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release-cli]
inherits = "release"
panic = "abort"
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release-capi]
inherits = "release"
panic = "unwind"
