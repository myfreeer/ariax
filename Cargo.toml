[workspace]
members = [
    "bin/ariax",
    "crates/ariax-config",
    "crates/ariax-core",
    "crates/ariax-engine",
    "crates/ariax-runtime",
    "crates/ariax-storage",
    "crates/ariax-windows-security",
    "tools/ariax-xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
ariax-config = { path = "crates/ariax-config" }
ariax-core = { path = "crates/ariax-core" }
ariax-engine = { path = "crates/ariax-engine" }
ariax-runtime = { path = "crates/ariax-runtime" }
ariax-storage = { path = "crates/ariax-storage" }
ariax-windows-security = { path = "crates/ariax-windows-security" }
crc32c = "=0.6.8"
fs2 = "=0.4.3"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled", "backup", "cache", "limits"] }
sha2 = { version = "=0.11.0", default-features = false }
unicode-normalization = "=0.1.25"
windows-sys = { version = "=0.61.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release-cli]
inherits = "release"
panic = "abort"
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release-capi]
inherits = "release"
panic = "unwind"
