[package]
name = "ariax-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.88"

[package.metadata]
cargo-fuzz = true

[dependencies]
ariax-core = { path = "../crates/ariax-core" }
ariax-engine = { path = "../crates/ariax-engine" }
ariax-storage = { path = "../crates/ariax-storage" }
hyper = { version = "=1.11.0", features = ["http1"] }
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.145"
tokio = { version = "=1.53.1", features = ["rt", "time", "test-util"] }

[[bin]]
name = "http_response_validator"
path = "fuzz_targets/http_response_validator.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_request_headers"
path = "fuzz_targets/http_request_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_retry_specs"
path = "fuzz_targets/http_retry_specs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_discard_budget"
path = "fuzz_targets/http_discard_budget.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_replay"
path = "fuzz_targets/journal_replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rpc_json"
path = "fuzz_targets/rpc_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_document"
path = "fuzz_targets/session_document.rs"
test = false
doc = false
bench = false
