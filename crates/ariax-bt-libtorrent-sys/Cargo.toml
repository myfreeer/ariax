[package]
name = "ariax-bt-libtorrent-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
links = "ariax_libtorrent"

[features]
default = []
native = ["dep:cxx", "dep:cxx-build", "dep:serde_json", "dep:sha2"]

[dependencies]
cxx = { workspace = true, optional = true }

[build-dependencies]
cxx-build = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

# The only BitTorrent unsafe boundary. Every borrowed argument is synchronous;
# asynchronous callbacks retain C++ ownership and never reference Rust memory.
[lints.rust]
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
