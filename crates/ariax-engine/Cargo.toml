[package]
name = "ariax-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
bt = ["dep:ariax-bt", "ariax-bt/libtorrent"]
metalink = ["dep:quick-xml"]
ftp = ["dep:suppaftp"]
sftp = ["dep:russh", "dep:russh-sftp", "dep:hmac", "dep:zeroize"]

[dependencies]
ariax-bt = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
base64ct.workspace = true
ariax-config.workspace = true
ariax-core.workspace = true
ariax-runtime.workspace = true
ariax-storage.workspace = true
bytes.workspace = true
cookie.workspace = true
cookie_store.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
hmac = { workspace = true, optional = true }
hickory-resolver.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client", "client-legacy", "http1", "tokio"] }
publicsuffix.workspace = true
md-5.workspace = true
quick-xml = { workspace = true, optional = true }
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
suppaftp = { workspace = true, optional = true }
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha1.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
tokio-rustls.workspace = true
tower-service.workspace = true
url.workspace = true

[dev-dependencies]
log = "=0.4.33"
rusqlite.workspace = true
tokio = { workspace = true, features = ["test-util", "fs", "io-std", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
ariax-windows-security.workspace = true

[lints]
workspace = true

[[bench]]
name = "http_capacity_profile"
harness = false

[[bench]]
name = "rpc_dispatch_profile"
harness = false

[[bench]]
name = "rpc_active_profile"
harness = false
